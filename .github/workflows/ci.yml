name: ci
on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --workspace --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo build --locked -p nysm-cli --no-default-features
      - run: python3 scripts/pty_smoke.py target/debug/nysm
      - run: python3 scripts/remote_smoke.py target/debug/nysm
      - name: headless dependency audit
        run: |
          if cargo tree -p nysm-cli -e normal --prefix none | grep -iE 'gtk|glib|x11|wayland|dbus|zbus|systemd'; then
            echo "GUI/session dependency leaked into the CLI" >&2; exit 1
          fi

  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev
      - run: cargo clippy -p nysm-desktop --locked -- -D warnings
      - run: cargo build -p nysm-desktop --locked

  # Other OSes: build and run to prove the binary starts and reports
  # `unsupported` honestly. This is NOT a claim of metric support.
  portability:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-latest, windows-latest]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace --locked
      - run: cargo run --locked -p nysm-cli -- capabilities --json
