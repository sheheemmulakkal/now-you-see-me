name: ci

# Linux only for now. Every push runs lint, tests, MSRV and the desktop app;
# release packaging runs for main, pull requests and tags. The arm64 job
# runs only once the repository is public (GitHub's arm64 Linux runners are
# free for public repositories only). Documentation-only pushes skip CI.
on:
  push:
    branches: ["**"]
    tags: ["v*"]
    paths-ignore: ["docs/**", "**/*.md", "LICENSE-*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      # Default members: everything except the GTK desktop app (own job).
      - run: cargo clippy --locked --all-targets -- -D warnings
      - name: headless dependency audit
        run: |
          if cargo tree --locked -p nysm-cli -e normal --prefix none | grep -iE 'gtk|glib|x11|wayland|dbus|zbus|systemd'; then
            echo "GUI/session dependency leaked into the CLI" >&2; exit 1
          fi

  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked -p nysm-cli --no-default-features
      - run: cargo build --locked -p nysm-cli
      # Real pseudo-terminal checks and `tui --remote` through a stand-in ssh.
      - run: python3 scripts/pty_smoke.py target/debug/nysm
      - run: python3 scripts/remote_smoke.py target/debug/nysm

  msrv:
    name: msrv (1.88)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --locked --all-targets

  desktop:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --locked -p nysm-desktop --all-targets -- -D warnings
      - run: cargo test --locked -p nysm-desktop

  # Release artifacts: static tarball and .deb packages, installed into a
  # temporary prefix and uninstalled again to prove both scripts work.
  package:
    if: github.event_name != 'push' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-4-dev
      - uses: Swatinem/rust-cache@v2
      - run: scripts/package.sh
      - name: install, run, uninstall
        run: |
          set -eu
          tmp=$(mktemp -d)
          tar -xzf target/dist/nysm-*-linux.tar.gz -C "$tmp"
          file "$tmp"/nysm-*/bin/nysm | grep -q 'static'
          PREFIX="$tmp/prefix" sh "$tmp"/nysm-*/install.sh
          "$tmp/prefix/bin/nysm" --version
          "$tmp/prefix/bin/nysm" summary --json | python3 -c 'import json,sys; json.load(sys.stdin)'
          PREFIX="$tmp/prefix" sh "$tmp/prefix/share/nysm/uninstall.sh"
          left=$(find "$tmp/prefix" -type f | wc -l)
          [ "$left" -eq 0 ] || { echo "uninstall left $left files" >&2; exit 1; }
      - run: scripts/package-deb.sh
      - uses: actions/upload-artifact@v4
        with:
          name: nysm-linux-x86_64
          path: |
            target/dist/*.tar.gz
            target/dist/*.sha256
            target/dist/deb/*.deb
          retention-days: 14

  # Same checks on arm64 Linux; skipped while the repository is private.
  test-arm64:
    if: ${{ !github.event.repository.private }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked
      - run: cargo build --locked -p nysm-cli
      - run: python3 scripts/pty_smoke.py target/debug/nysm
