name: Bug report
description: Something shows a wrong value, crashes or behaves unexpectedly
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: For a wrong value, include what another tool (top, free, df, ip -s link) shows at the same time.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `nysm tui`
        2. Press 2 …
    validations:
      required: true
  - type: dropdown
    id: part
    attributes:
      label: Which part?
      options: [CLI (nysm), Terminal UI (nysm tui), Desktop app, Top bar (nysm-tray), Collector service, GNOME extension, Install / packaging]
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Output of `nysm --version` and `nysm doctor` (it reports which metrics are available and why; it never prints secrets).
      render: text
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: Screenshots or logs
