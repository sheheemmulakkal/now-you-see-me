name: Feature request
description: Something you need to see or do that is missing
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to find out or do?
      description: Describe the situation and question first; the solution can come later.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
  - type: textarea
    id: alternatives
    attributes:
      label: How do you do it today?
