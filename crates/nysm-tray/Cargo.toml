[package]
name = "nysm-tray"
description = "Now You See Me: system tray / AppIndicator (StatusNotifierItem) indicator"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "nysm-tray"
path = "src/main.rs"

[dependencies]
nysm-core.workspace = true
nysm-engine.workspace = true
nysm-ipc.workspace = true
nysm-config.workspace = true
# Pure-Rust StatusNotifierItem over D-Bus (zbus); no tokio, no C libraries.
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
