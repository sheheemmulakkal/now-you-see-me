[package]
name = "nysm-cli"
description = "Now You See Me: a resource monitor for engineers (CLI and TUI)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[[bin]]
name = "nysm"
path = "src/main.rs"

[features]
default = ["tui"]
tui = ["dep:nysm-tui"]

[dependencies]
nysm-core.workspace = true
nysm-collect.workspace = true
nysm-engine.workspace = true
nysm-record.workspace = true
nysm-config.workspace = true
nysm-ipc.workspace = true
nysm-tui = { workspace = true, optional = true }
clap.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
